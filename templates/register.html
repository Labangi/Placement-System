{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}

<div class="form-container">

  <div class="text-center mb-4">
    <i class="bi bi-person-plus-fill fs-1 text-success"></i>
    <h2 class="fw-bold mt-2">Create Account</h2>
    <p class="text-muted small">Join the Placement Portal</p>
  </div>

  <form method="POST" action="{{ url_for('register') }}">

    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input
        type="text"
        class="form-control"
        id="username"
        name="username"
        placeholder="Enter username"
        required
      />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Enter password"
        required
      />
    </div>

    <div class="mb-4">
      <label for="role" class="form-label">Role</label>
      <select class="form-select" id="role" name="role" required>
        <option value="" selected disabled>Choose role</option>
        <option value="Student">Student</option>
        <option value="Company">Company</option>
      </select>
    </div>

    <button type="submit"
            class="btn w-100 text-white fw-semibold"
            style="background: linear-gradient(90deg,#198754,#20c997);
                   border:none;
                   padding:12px;
                   border-radius:12px;">
        <i class="bi bi-check-circle me-2"></i>Register
    </button>

  </form>

  <div class="text-center mt-4">
    <small class="text-muted">
      Already have an account?
      <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none">
        Login here
      </a>
    </small>
  </div>

</div>

{% endblock %}
